name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    # Pinned (not ubuntu-latest) so a runner upgrade cannot break the build.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Takes seconds. Stops here if a file is incomplete or misplaced,
      # instead of spending 20 minutes building an app that cannot start.
      - name: Check the app files
        run: python selfcheck.py

      # Shown at the bottom of the Settings screen: "build <number>".
      - name: Stamp the build number
        run: echo "BUILD = \"${{ github.run_number }}\"" > build_info.py

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev automake build-essential

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install "Cython<3" buildozer==1.6.0

      - name: Cache buildozer global + .buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      # Keeps the same signing key between builds, so a new APK installs
      # over the old one (and keeps your library) without uninstalling.
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build APK with Buildozer
        env:
          # Stops python-for-android from upgrading to a broken pip release.
          PIP_CONSTRAINT: ${{ github.workspace }}/pip-constraint.txt
        run: |
          # The Android Gradle plugin needs Java 17; the runner defaults to 11.
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "Using JAVA_HOME=$JAVA_HOME"
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunkreader-apk-build${{ github.run_number }}
          path: bin/*.apk
